# Deploy on Fly.io: `fly launch --copy-config --no-deploy`, `fly volumes create data --size 1`, then `fly deploy`.
app = "hoops-pickem"
primary_region = "iad"

[build]

[env]
  SEASON_START = "2026-11-02"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep running so scores sync in the background
  min_machines_running = 1

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
